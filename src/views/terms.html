<section class="view" data-view="terms" hidden>
  <div class="view-head">
    <h1>러닝 용어 사전</h1>
    <p>달리기를 시작하면 만나는 낯선 말을 쉬운 말로 풀었습니다. 찾는 용어를 입력하면 바로 걸러 드립니다.</p>
  </div>
  <div class="panel form">
    <div class="field"><label for="term-q">용어 찾기</label><input type="text" id="term-q" class="term-find" autocomplete="off" placeholder="예: LSD, 빌드업, 서브4"></div>
    <p class="note" id="term-none" hidden>찾는 용어가 없습니다. 다른 말로 찾아보세요.</p>
  </div>
{{terms_html}}
</section>
